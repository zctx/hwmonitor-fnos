name: Review source snapshot
on:
  push:
    branches: [review/v1.5.8]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive review baseline
        run: |
          mkdir snapshot
          git archive --format=tar.gz HEAD > snapshot/adapter.tar.gz
          git rev-parse HEAD > snapshot/commit.txt
          sha256sum snapshot/adapter.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: snapshot/
          retention-days: 3
