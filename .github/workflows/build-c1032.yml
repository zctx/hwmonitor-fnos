name: Review and build fnOS FPK
on:
  push:
    branches: [main, review/v1.5.8]
    paths: ['upstream.lock', 'overlay/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/build-c1032.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fpk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.lock.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: lock
        run: |
          source upstream.lock
          [[ "$BUILD_IMAGE" =~ ^makedie/fnos@sha256:[a-f0-9]{64}$ ]]
          echo "image=$BUILD_IMAGE" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.prepare.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare tools and exact headers
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc binutils kmod python3 tar gzip curl perl coreutils nodejs
          source upstream.lock
          for k in $SUPPORTED_KERNELS; do
            bash scripts/prepare-fnos-headers.sh "$k"
          done
      - name: Compile, regression test and verify actual FPK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh 2>&1 | tee build-test.log
          cp build-test.log dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hwmonitor-fnos-current
          path: dist/
          if-no-files-found: error
          retention-days: 30
