name: Build c1032 FPK

on:
  push:
    branches: [main]
    paths:
      - upstream.lock
      - .github/workflows/build-c1032.yml
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: makedie/fnos:kernHead-6.18.18.c1032-trim-amd64

    steps:
      - name: Checkout adapter repo
        uses: actions/checkout@v4

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc binutils kmod python3 tar gzip xz-utils

      - name: Build patched FPK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh

      - name: Verify N5A driver identity and loader gate
        shell: bash
        run: |
          set -euo pipefail
          source ./upstream.lock
          KO="dist/minisforum_n5_it5571-${TARGET_KERNEL}.ko"
          test -f "$KO"
          test "$(modinfo -F version "$KO")" = "$EXPECTED_DRIVER_VERSION"
          test "$(modinfo -F srcversion "$KO")" = "$EXPECTED_DRIVER_SRCVERSION"
          case "$(modinfo -F vermagic "$KO")" in
            "$TARGET_KERNEL"*) ;;
            *) echo "vermagic mismatch" >&2; exit 1 ;;
          esac
          modinfo "$KO" | grep -q '^parm:.*experimental_write:'

          SRC="dist/hwmonitor-fnos-${PACKAGE_VERSION}-source.tar.gz"
          TMP="$(mktemp -d)"
          tar -xzf "$SRC" -C "$TMP"
          grep -Fq "insmodArgs.push('experimental_write=1')" "$TMP/driverload.js"
          grep -Fq "/^(N5A|N5 AIR)$/i.test(product) && /^F8NAB$/i.test(board)" "$TMP/driverload.js"

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: hwmonitor-fnos-c1032
          if-no-files-found: error
          path: dist/
