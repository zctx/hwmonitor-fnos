name: Build current fnOS FPK

on:
  push:
    branches: [main]
    paths:
      - upstream.lock
      - .github/workflows/build-c1032.yml
      - scripts/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: makedie/fnos:kernHead-baseEnv-amd64

    steps:
      - name: Checkout adapter repo
        uses: actions/checkout@v4

      - name: Prepare tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc binutils kmod python3 tar gzip xz-utils curl perl coreutils

      - name: Prepare exact fnOS kernel headers
        shell: bash
        run: |
          set -euo pipefail
          source ./upstream.lock
          for k in $SUPPORTED_KERNELS; do
            bash scripts/prepare-fnos-headers.sh "$k"
          done

      - name: Build patched FPK
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build.sh

      - name: Verify multi-kernel package
        shell: bash
        run: |
          set -euo pipefail
          source ./upstream.lock
          for k in $SUPPORTED_KERNELS; do
            KO="dist/minisforum_n5_it5571-${k}.ko"
            test -f "$KO"
            test "$(modinfo -F version "$KO")" = "$EXPECTED_DRIVER_VERSION"
            test "$(modinfo -F srcversion "$KO")" = "$EXPECTED_DRIVER_SRCVERSION"
            case "$(modinfo -F vermagic "$KO")" in
              "$k"*) ;;
              *) echo "vermagic mismatch for $k" >&2; exit 1 ;;
            esac
          done
          test -f "dist/hwmonitor_${PACKAGE_VERSION}_x86.fpk"
          grep -Fxq "package_version=${PACKAGE_VERSION}" dist/build-info.txt
          grep -Fxq 'remote_driver_channel=kernel-modules' dist/build-info.txt
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: hwmonitor-fnos-${{ env.PACKAGE_VERSION || 'current' }}
          if-no-files-found: error
          path: dist/
