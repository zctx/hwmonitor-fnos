name: Maintain verified kernel module channel v2
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['upstream.lock', '.github/workflows/kernel-modules.yml', 'scripts/channel.py', 'scripts/driver_index.py', 'scripts/fnos_headers.py', 'scripts/build-driver-only.sh', 'scripts/prepare-fnos-headers.sh', 'scripts/signforfn.sh']
permissions:
  contents: read
concurrency:
  group: kernel-modules-v2
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.plan.outputs.kernels }}
      ref: ${{ steps.plan.outputs.metadata_ref }}
      image: ${{ steps.plan.outputs.build_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/channel.py plan plan.json
  build:
    needs: plan
    if: needs.plan.outputs.kernels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        kernel: ${{ fromJSON(needs.plan.outputs.kernels) }}
    container:
      image: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Compile using immutable metadata snapshot
        env:
          TARGET: ${{ matrix.kernel }}
          META_REF: ${{ needs.plan.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates make gcc binutils kmod python3 curl perl
          bash scripts/prepare-fnos-headers.sh "$TARGET" "$META_REF"
          bash scripts/build-driver-only.sh "$TARGET" dist-driver
          cp .headers-info/"$TARGET".txt dist-driver/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: driver-${{ matrix.kernel }}
          path: dist-driver/
          retention-days: 7
  publish:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.kernels != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Get outputs of this exact workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'driver-*' --dir outputs
      - name: Verify metadata and publish modules before index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y kmod
          python3 scripts/channel.py publish outputs
